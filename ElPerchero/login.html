<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPerchero - Iniciar sesión</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

    <aside class="barra-lateral">
        <header class="logo"><h1>ElPerchero</h1></header>
        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg> Inicio</a></li>
                <li><a href="armario.html"><svg class="icon" aria-hidden="true"><use href="#icon-wardrobe"></use></svg> Armario</a></li>
                <li><a href="favoritos.html"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg> Favoritos</a></li>
                <li><a href="anadir-prenda.html"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> Añadir</a></li>
                <li><a href="chatbot.html"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg> ChatBot</a></li>
                <li><a href="perfil.html"><svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg> Perfil</a></li>
            </ul>
        </nav>
    </aside>

    <svg style="display:none;" aria-hidden="true">
        <symbol id="icon-home" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="icon-wardrobe" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="icon-google" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09zM12 4.84C8.03 4.84 5.06 6.73 3.55 9.67v2.91h3.42c.21-.75.5-1.45.94-2.06 1.19-1.61 3.06-2.68 5.19-2.68 1.58 0 3.03.49 4.26 1.36l2.68-2.64C18.03 5.54 15.31 4.84 12 4.84zM3.55 15.51v2.91h3.42c.21-.75.5-1.45.94-2.06 1.19-1.61 3.06-2.68 5.19-2.68 1.58 0 3.03.49 4.26 1.36l2.68-2.64c-1.7-.56-3.42-.89-5.19-.89-3.53 0-6.48 2.23-6.95 5.27zM12 20.28c-4.12 0-7.46-2.83-8.29-6.78h2.98c.47 1.48 1.64 2.51 2.94 2.78v2h3.57c-1.28-.25-2.49-1.07-3.44-2.17l-.76 1.48c2.22 2.58 5.62 4.17 9.36 4.17 5.9 0 10.36-4.16 10.36-9.19 0-.52-.03-1.05-.08-1.57h-3.07c-.47 1.47-1.64 2.49-2.93 2.72v-2h3.57c1.27-.24 2.48-1.06 3.43-2.18l.76-1.47c-2.21-2.57-5.6-4.16-9.35-4.16-3.53 0-6.48 2.23-6.95 5.27z"/></symbol>
        <symbol id="icon-apple" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c-4.96 0-8-4.3-8-9.5 0-2.17 1.2-4.3 3-6.11 2.03-2.04 5.54-3.39 8-3.39s5.97 1.35 8 3.39c1.8 1.81 3 3.94 3 6.11 0 5.2-3.04 9.5-8 9.5z"/></symbol>
    </svg>

    <main class="zona-principal">
        <div class="formulario-auth">
            <div class="pestanas-auth">
                <button class="pestana pestana-activa" data-pestana="login">Iniciar sesión</button>
                <button class="pestana" data-pestana="registro">Registrarse</button>
            </div>

            <form id="form-login" novalidate>
                <div class="campo-grupo">
                    <label for="correo-login">Correo Electrónico</label>
                    <input type="email" id="correo-login" name="correo" required placeholder="ejemplo@gmail.com">
                    <span class="error-texto" id="error-correo-login" aria-live="polite"></span>
                </div>

                <div class="campo-grupo">
                    <label for="contrasena-login">Contraseña</label>
                    <input type="password" id="contrasena-login" name="contrasena" required>
                    <span class="error-texto" id="error-contrasena-login" aria-live="polite"></span>
                </div>

                <div class="campo-grupo campo-checkbox">
                    <input type="checkbox" id="recordar" name="recordar">
                    <label for="recordar">Recuérdame</label>
                </div>

                <button type="submit" class="btn btn-primaria btn-grande w-full">Continuar</button>

                <div class="dividor-conectar">
                    <span>O continuar con</span>
                </div>

                <!-- Botones no funcionales (placeholders) por ahora -->
                <button type="button" class="btn btn-secundaria btn-grande w-full mb-4"><svg class="icon" aria-hidden="true"><use href="#icon-google"></use></svg> Continuar con Google</button>
                <button type="button" class="btn btn-secundaria btn-grande w-full"><svg class="icon" aria-hidden="true"><use href="#icon-apple"></use></svg> Continuar con Apple</button>
            </form>

            <p class="texto-auth">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>

</body>
</html>
