<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPerchero - Añadir Prenda</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <aside class="barra-lateral">
        <header class="logo">
            <h1>ElPerchero</h1>
        </header>

        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="armario.html">Armario</a></li>
                <li><a href="favoritos.html">Favoritos</a></li>
                <li><a href="chatbot.html">Chat bot</a></li>
                <li><a href="perfil.html">Perfil</a></li>
            </ul>
        </nav>
    </aside>
    
    <main class="zona-principal">
        <form class="formulario-prenda" action="#" method="post" enctype="multipart/form-data">
            
            <label class="zona-subida">
                <input type="file" name="imagen_prenda" accept=".jpg, .jpeg, .png, .webp" required>
                <span class="texto-principal">Suba la prenda que quiera añadir</span>
                <small class="formatos-aceptados">Formatos: JPG,PNG, WEBP</small>
            </label>

            <fieldset class="campo-tipo">
                <label for="tipo-prenda">Tipo de prenda:</label>
                <input type="text" id="tipo-prenda" name="tipo_prenda" placeholder="Camisa, chaqueta,etc" required>
            </fieldset>

            <label class="opcion-favorito">
                <input type="checkbox" name="favorita">
                <span>Marcar como prenda favorita</span>
            </label>

        </form>
    </main>

</body>
</html>
