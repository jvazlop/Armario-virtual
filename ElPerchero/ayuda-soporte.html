<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPerchero - Ayuda y Soporte</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

    <aside class="barra-lateral">
        <header class="logo"><h1>ElPerchero</h1></header>
        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg> Inicio</a></li>
                <li><a href="armario.html"><svg class="icon" aria-hidden="true"><use href="#icon-wardrobe"></use></svg> Armario</a></li>
                <li><a href="favoritos.html"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg> Favoritos</a></li>
                <li><a href="anadir-prenda.html"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> Añadir</a></li>
                <li><a href="chatbot.html"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg> ChatBot</a></li>
                <li><a href="perfil.html"><svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg> Perfil</a></li>
            </ul>
        </nav>
    </aside>

    <svg style="display:none;" aria-hidden="true">
        <symbol id="icon-home" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
        <symbol id="icon-wardrobe" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="icon-message" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    </svg>

    <main class="zona-principal">
        <a href="index.html" class="btn btn-secundaria btn-volver mb-6"><svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg> Volver al inicio</a>

        <header class="cabecera-seccion">
            <h2>Ayuda y Soporte</h2>
        </header>

        <section class="area-contacto">
            <div class="formulario-contacto">
                <h3>Envíanos un mensaje</h3>
                <form id="form-contacto" novalidate>
                    <div class="campo-grupo">
                        <label for="nombre-contacto">Nombre</label>
                        <input type="text" id="nombre-contacto" name="nombre" required minlength="2" maxlength="50" placeholder="Tu nombre">
                        <span class="error-texto" id="error-nombre-contacto" aria-live="polite"></span>
                    </div>

                    <div class="campo-grupo">
                        <label for="correo-contacto">Correo</label>
                        <input type="email" id="correo-contacto" name="correo" required placeholder="ejemplo@gmail.com">
                        <span class="error-texto" id="error-correo-contacto" aria-live="polite"></span>
                    </div>

                    <div class="campo-grupo">
                        <label for="telefono-contacto">Teléfono (opcional)</label>
                        <input type="tel" id="telefono-contacto" name="telefono" placeholder="+34 600 000 000">
                        <span class="error-texto" id="error-telefono-contacto" aria-live="polite"></span>
                    </div>

                    <div class="campo-grupo">
                        <label class="label-motivo">Motivo</label>
                        <div class="opciones-motivo">
                            <label class="opcion-radio">
                                <input type="radio" name="motivo" value="reservar-mesa" required> Reservar mesa
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="motivo" value="incidencia-pedido"> Incidencia con un pedido
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="motivo" value="proponer-ruta"> Proponer una ruta
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="motivo" value="otro"> Otro
                            </label>
                        </div>
                        <span class="error-texto" id="error-motivo-contacto" aria-live="polite"></span>
                    </div>

                    <div class="campo-grupo campo-checkbox">
                        <input type="checkbox" id="llamar-contacto" name="llamar">
                        <label for="llamar-contacto">Prefiero que me llaméis</label>
                    </div>

                    <div class="campo-grupo">
                        <label for="mensaje-contacto">Mensaje</label>
                        <textarea id="mensaje-contacto" name="mensaje" required minlength="10" maxlength="500" placeholder="Cuéntanos cómo podemos ayudarte"></textarea>
                        <span class="contador-caracteres" id="contador-mensaje">0 / 500</span>
                        <span class="error-texto" id="error-mensaje-contacto" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn btn-primaria btn-grande w-full">Enviar mensaje</button>
                </form>
            </div>

            <div class="area-mensajes-enviados">
                <h3>Mensajes enviados</h3>
                <div id="lista-mensajes" class="lista-mensajes">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </section>
    </main>

</body>
</html>
