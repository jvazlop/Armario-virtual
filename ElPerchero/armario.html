<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElPerchero - Tu Armario</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <aside class="barra-lateral">
        <header class="logo">
            <h1>ElPerchero</h1>
        </header>

        <nav class="menu" aria-label="Menú principal">
            <ul>
                <li><a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg> Inicio</a></li>
                <li><a href="armario.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-wardrobe"></use></svg> Armario</a></li>
                <li><a href="favoritos.html"><svg class="icon" aria-hidden="true"><use href="#icon-heart"></use></svg> Favoritos</a></li>
                <li><a href="anadir-prenda.html"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg> Añadir</a></li>
                <li><a href="chatbot.html"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg> ChatBot</a></li>
                <li><a href="perfil.html"><svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg> Perfil</a></li>
            </ul>
        </nav>
    </aside>

    <!-- SVG Sprite for icons -->
    <svg style="display: none;" aria-hidden="true">
        <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </symbol>
        <symbol id="icon-wardrobe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 3v18"/>
            <path d="M15 3v18"/>
            <path d="M3 9h18"/>
        </symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </symbol>
        <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </symbol>
    </svg>

    <main class="zona-principal">
        <header class="cabecera-seccion">
            <h2>Mi Armario</h2>
            <span id="contador-prendas" class="contador"></span>
        </header>
        <section id="listado-armario" class="cuadricula-prendas" aria-label="Lista de prendas en tu armario">
            <!-- Se genera desde JavaScript -->
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/armario.js"></script>
</body>
</html>
